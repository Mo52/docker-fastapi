name: FastAPI CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    steps:
    # ১. গিটহাব থেকে কোড নিয়ে আসা
    - name: Checkout code
      uses: actions/checkout@v4

    # ২. পাইথন সেটআপ করা
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    # ৩. প্রয়োজনীয় লাইব্রেরি ইনস্টল করা
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pytest httpx sqlite3 flake8
        # যদি requirements.txt থাকে তবে নিচেরটি আনকমেন্ট করুন
        # pip install -r requirements.txt

    # ৪. কোড ফরম্যাট ও স্টাইল চেক করা (Linting)
    - name: Lint with flake8
      run: |
        # গুরুত্বপূর্ণ কোড এরর চেক করবে
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # কোড স্টাইল চেক করবে
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # ৫. অটোমেটেড টেস্ট রান করা (Pytest)
    - name: Run tests with pytest
      run: |
        pytest
